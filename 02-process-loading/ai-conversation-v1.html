<style>

*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,textarea,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.4}button:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:4px}button{border:0;background:none}svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}[hidden]{display:none!important}.app{height:100vh;height:100dvh;display:grid;grid-template-columns:238px 1fr}.sidebar{background:var(--side);border-right:1px solid var(--line);padding:28px 16px 16px;display:flex;flex-direction:column;min-height:0}.brand{display:flex;gap:10px;align-items:center;padding:0 12px;margin-bottom:34px;font-size:21px;font-weight:650;letter-spacing:1px}.mark{width:29px;height:29px;color:var(--accent);display:grid;place-items:center}.mark svg{width:28px;height:28px;stroke-width:1.8}.new{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--paper);font-weight:500;width:100%;text-align:left}.new small{margin-left:auto;color:var(--subtle);font-size:11px}.nav-caption{margin:31px 12px 10px;color:var(--subtle);font-size:11px;letter-spacing:1px}.sessions{overflow:auto;flex:1}.session{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:10px 12px;border-radius:7px;color:var(--muted);margin-bottom:3px}.session span{white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.session.active{background:oklch(92.8% .006 250);color:var(--ink)}.session svg{width:15px}.sidebar-note{margin:20px 12px;color:var(--subtle);font-size:12px;line-height:1.8}.profile{border-top:1px solid var(--line);padding:17px 10px 0;display:flex;align-items:center;gap:10px;font-size:12px}.avatar{background:oklch(90% .017 260);color:oklch(44% .05 260);width:29px;height:29px;display:grid;place-items:center;border-radius:50%;font-size:11px}.profile small{color:var(--subtle);margin-left:auto}.main{min-width:0;display:flex;flex-direction:column;position:relative}.topbar{height:72px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 36px;gap:16px}.title{display:flex;align-items:center;gap:12px;min-width:0}.title h1{font-size:14px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0}.title .slash{color:var(--line)}.title small{color:var(--subtle);white-space:nowrap}.demo-controls{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:11px;white-space:nowrap}.badge{border:1px solid var(--line);border-radius:5px;padding:2px 7px}.demo-controls select{background:transparent;border:0;font-size:11px;padding:5px;cursor:pointer}.menu.icon-button{display:none}.scroll{flex:1;min-height:0;overflow:auto;scroll-behavior:auto;overscroll-behavior:contain}.thread{max-width:760px;margin:auto;padding:42px 24px 34px}.welcome{padding-top:9vh;max-width:600px;margin:auto}.welcome .mark{margin-bottom:23px;width:36px;height:36px}.welcome .mark svg{width:36px;height:36px}.welcome h2{font-size:27px;letter-spacing:-.7px;font-weight:550;margin:0 0 12px}.welcome p{color:var(--muted);margin:0;font-size:14px;line-height:1.9}.suggestions{margin-top:32px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}.suggestion{padding:8px 0;color:var(--muted);display:flex;gap:12px;align-items:center;text-align:left}.suggestion svg{color:var(--subtle);width:16px}.suggestion .right{margin-left:8px;opacity:0;transition:opacity 150ms}.user{margin:4px 0 35px;display:flex;justify-content:flex-end}.bubble{max-width:85%;padding:12px 18px;background:var(--soft);border-radius:18px 18px 5px 18px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8}.assistant{margin:0 0 46px}.assistant-name{font-weight:550;display:flex;align-items:center;gap:8px;margin-bottom:15px;font-size:13px}.assistant-name .mark{width:21px;height:21px}.assistant-name .mark svg{width:21px;height:21px}.intro{margin:0 0 17px;line-height:1.9}.process{margin:2px 0 21px}.process-toggle{display:flex;align-items:center;gap:9px;padding:6px 0;max-width:100%;min-height:34px;text-align:left;color:var(--muted);font-size:12px}.status-icon{width:15px;height:15px;display:grid;place-items:center;flex-shrink:0}.spinner{width:13px;height:13px;border:1.5px solid var(--line);border-top-color:var(--muted);border-radius:50%;animation:spin 950ms linear infinite}.status-icon svg{width:15px;height:15px}.latest{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:440px}.step-count{color:var(--subtle);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:11px}.chevron{width:13px;height:13px;transition:transform 180ms var(--ease);color:var(--subtle)}[aria-expanded=true] .chevron{transform:rotate(90deg)}.history{margin:10px 0 0 6px;padding-left:20px;border-left:1px solid var(--line);animation:enter 180ms var(--ease)}.history-head{display:flex;align-items:center;justify-content:space-between;font-size:10px;color:var(--subtle);padding-bottom:12px;letter-spacing:.5px}.history-list{list-style:none;padding:0;margin:0}.step{position:relative;padding:0 0 17px;animation:enter 180ms var(--ease)}.step:before{content:"";position:absolute;width:5px;height:5px;background:var(--line);border:3px solid var(--paper);box-sizing:content-box;border-radius:50%;left:-26px;top:6px}.step.current:before{background:var(--muted)}.step-title{display:flex;gap:8px;align-items:baseline;font-size:12px;color:var(--muted)}.step-title time{margin-left:auto;font-size:10px;color:var(--subtle);font-variant-numeric:tabular-nums;white-space:nowrap}.step-detail{display:block;color:var(--subtle);font-size:11px;margin:4px 0 0;overflow-wrap:anywhere;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.step.current .step-title{color:var(--ink)}.answer{font-size:14px;line-height:1.95;white-space:pre-wrap;overflow-wrap:anywhere}.answer.streaming:after{content:"";width:5px;height:15px;margin-left:3px;display:inline-block;vertical-align:middle;background:var(--muted);animation:blink 1s steps(2) infinite}.answer-actions{display:flex;align-items:center;gap:14px;margin-top:18px;color:var(--subtle)}.icon-button{display:inline-flex;align-items:center;justify-content:center;padding:6px;border-radius:5px}.answer-actions button{font-size:11px;display:flex;align-items:center;gap:5px}.answer-actions svg{width:15px;height:15px}.completed-note{font-size:11px;color:var(--subtle);margin-left:auto}.composer-wrap{flex-shrink:0;width:100%;padding:10px 24px 20px;background:var(--paper)}.composer-area{max-width:712px;margin:auto;position:relative}.composer{border:1px solid oklch(87% .008 250);border-radius:17px;padding:16px 16px 12px;background:var(--paper);box-shadow:0 3px 12px oklch(25% .01 250 / .035)}.composer:focus-within{border-color:oklch(72% .025 260)}textarea{display:block;width:100%;resize:none;min-height:49px;max-height:150px;border:0;outline:none!important;background:none;font-size:14px;line-height:1.7;padding:0 0 8px}textarea::placeholder{color:var(--subtle)}.composer-bottom{display:flex;align-items:center;justify-content:space-between}.mode{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px}.mode svg{width:14px;height:14px}.send{width:32px;height:32px;background:var(--ink);color:var(--paper);border-radius:50%;display:grid;place-items:center;transition:transform 150ms var(--ease)}.send:active{transform:scale(.96)}.send svg{width:18px;height:18px}.send .stop{width:11px;height:11px;background:currentColor;border-radius:2px}.footer{font-size:10px;color:var(--subtle);display:flex;justify-content:center;gap:16px;margin-top:10px}.jump{position:absolute;bottom:calc(100% + 16px);left:50%;transform:translateX(-50%);width:30px;height:30px;border:1px solid var(--line);border-radius:50%;background:var(--paper);box-shadow:0 2px 5px #20253509;display:grid;place-items:center}.jump svg{width:15px;height:15px;transform:rotate(180deg)}.toast{position:fixed;bottom:180px;left:50%;transform:translateX(-50%);padding:8px 14px;background:var(--ink);color:var(--paper);border-radius:8px;font-size:12px;z-index:10}.mobile-overlay{display:none}@keyframes spin{to{transform:rotate(360deg)}}@keyframes blink{50%{opacity:0}}@keyframes enter{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}@media(hover:hover) and (pointer:fine){button:not(.send):not(:disabled):hover{color:var(--ink)}.session:hover,.icon-button:hover{background:var(--soft)}.suggestion:hover .right{opacity:1}.process-toggle:hover .latest{text-decoration:underline;text-underline-offset:4px}}@media(min-width:1500px){.thread{padding-top:65px}.welcome{padding-top:12vh}}@media(max-width:900px){.app{grid-template-columns:200px 1fr}.topbar{padding:0 24px}.title small,.title .slash{display:none}.latest{max-width:290px}}@media(max-width:640px){.app{display:flex}.main{width:100%}.sidebar{display:none;position:fixed;z-index:5;inset:0 auto 0 0;width:240px}.app.nav-open .sidebar{display:flex}.app.nav-open .mobile-overlay{display:block;position:fixed;inset:0;background:#20253540;z-index:4}.menu.icon-button{display:grid;padding:5px}.topbar{height:60px;padding:0 15px}.title{gap:7px}.demo-controls{gap:4px}.thread{padding:24px 20px}.welcome{padding-top:8vh}.welcome h2{font-size:24px}.composer-wrap{padding:8px 14px 13px}.latest{max-width:calc(100vw - 157px)}.footer{font-size:9px;gap:8px}.step-title{font-size:11px}.bubble{max-width:92%}.completed-note{display:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

<body>
<svg style="display:none" aria-hidden="true"><defs>
<symbol id="logo" viewBox="0 0 24 24"><path d="M5 6.5 12 3l7 3.5v8L12 21l-7-6.5z"/><path d="m5 6.5 7 5 7-5M12 11.5V21M8 5l8 13M16 5 8 18"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="chat" viewBox="0 0 24 24"><path d="M20 15a3 3 0 0 1-3 3H8l-5 3V6a3 3 0 0 1 3-3h11a3 3 0 0 1 3 3z"/></symbol><symbol id="arrow" viewBox="0 0 24 24"><path d="m6 10 6-6 6 6M12 4v16"/></symbol><symbol id="chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol><symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol><symbol id="file" viewBox="0 0 24 24"><path d="M13 3H5v18h14V9zM13 3v6h6M8 13h8M8 17h5"/></symbol><symbol id="copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M15 8V3H3v13h5"/></symbol><symbol id="retry" viewBox="0 0 24 24"><path d="M20 10a8 8 0 1 0-2 8M20 4v6h-6"/></symbol><symbol id="spark" viewBox="0 0 24 24"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/></symbol><symbol id="menu-icon" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
</defs></svg>
<div class="app" id="app">
<button class="mobile-overlay" aria-label="关闭导航"></button>
<aside class="sidebar" aria-label="对话导航">
<div class="brand"><span class="mark"><svg><use href="#logo"/></svg></span>寻知</div>
<button class="new" id="new"><svg><use href="#plus"/></svg>新对话<small>⌘ K</small></button>
<div class="nav-caption">对话记录</div><nav class="sessions" id="sessions" aria-label="对话记录"></nav>
<div class="sidebar-note">让每一步，都有迹可循。<br>让思考，回到对话本身。</div>
<div class="profile"><span class="avatar">寻</span><span>我的工作空间</span><small>个人版</small></div>
</aside>
<main class="main">
<header class="topbar"><div class="title"><button class="menu icon-button" aria-label="打开导航"><svg><use href="#menu-icon"/></svg></button><h1 id="title">新对话</h1><span class="slash">/</span><small>寻知助手</small></div><div class="demo-controls"><span class="badge">交互演示</span><select id="speed" aria-label="演示速度"><option value="1">正常速度</option><option value="2">2 倍速度</option><option value="0.5">慢速观察</option></select></div></header>
<div class="scroll" id="scroll"><div class="thread" id="thread"></div></div>
<div class="composer-wrap"><div class="composer-area"><button class="jump" id="jump" aria-label="回到最新消息" hidden><svg><use href="#arrow"/></svg></button><form class="composer" id="form"><textarea id="input" rows="2" aria-label="消息" placeholder="向寻知提问，或描述你想完成的事…">帮我梳理 AI 对话中，执行过程应该如何展示。</textarea><div class="composer-bottom"><span class="mode"><svg><use href="#spark"/></svg>深度处理<span style="padding:0 3px;color:var(--line)">·</span>过程可追溯</span><button class="send" id="send" type="submit" aria-label="发送消息"><svg><use href="#arrow"/></svg></button></div></form><div class="footer"><span>演示数据 · 未连接模型与真实文件</span><span>Enter 发送，Shift + Enter 换行</span></div></div></div>
</main></div><div class="toast" role="status" id="toast" hidden></div>
<script>
// Standalone interaction prototype. All tool events and answers are simulated locally.
// Replace run()'s timed events with your model's event stream; renderProcess() preserves disclosure state.
const $=s=>document.querySelector(s),icon=id=>`<svg aria-hidden="true"><use href="#${id}"/></svg>`,escape=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const steps=[
['正在理解你的问题','解析对话上下文，确认任务目标','理解了问题与预期产出',1500],
['正在加载文档检索能力','load_skill("document-search")','已加载文档检索能力',1900],
['正在检索相关资料','search("AI 对话 · 执行过程 · 状态反馈")','找到 3 份相关资料',2300],
['正在读取 产品需求.md','read_file("产品需求.md") · 128 行','已读取 产品需求.md',2000],
['正在读取 对话交互规范.md','read_file("对话交互规范.md") · 86 行','已读取 对话交互规范.md',2200],
['正在提取关键交互状态','extract_states() · 发送 / 处理 / 回答 / 完成','已提取 4 个关键交互状态',1600],
['正在读取 工具调用示例.json','read_file("工具调用示例.json") · 12 条事件','已读取 工具调用示例.json',1800],
['正在比对过程展示方式','compare("单条更新", "完整时间线")','已完成 2 种展示方式的比对',2000],
['正在整理历史过程','group_events() · 按时间顺序归档','已整理执行记录',1500],
['正在检查停止与重试状态','check_states("stop", "retry", "complete")','已检查停止、重试与完成状态',1800],
['正在组织回答','compose_answer() · 汇总交互建议','已完成回答整理',1600],
['准备生成回答','工具处理结束，开始输出回答','全部处理步骤已完成',900]
];
let sessions=[],activeId=0,job=null,seq=0,pinned=true,toastTimer;
const active=()=>sessions.find(s=>s.id===activeId);
function newSession(){if(job)stop();const s={id:++seq,title:'新对话',turns:[],draft:''};sessions.unshift(s);activeId=s.id;$('#input').value='';render();$('#app').classList.remove('nav-open');$('#input').focus()}
function renderNav(){$('#sessions').innerHTML=sessions.map(s=>`<button class="session ${s.id===activeId?'active':''}" data-session="${s.id}" ${s.id===activeId?'aria-current="page"':''}>${icon('chat')}<span>${escape(s.title)}</span></button>`).join('');$('#title').textContent=active().title}
function render(){renderNav();$('#thread').innerHTML='';if(!active().turns.length){$('#thread').innerHTML=`<section class="welcome"><span class="mark">${icon('logo')}</span><h2>从一个问题开始。</h2><p>查找资料、梳理思路，把复杂的问题一步步理清。<br>你可以随时展开，查看我正在做什么。</p><div class="suggestions"><button class="suggestion" data-prompt="帮我梳理 AI 对话中，执行过程应该如何展示。">${icon('chat')}设计一个更清晰的 AI 回答过程<span class="right">↗</span></button><button class="suggestion" data-prompt="帮我整理项目资料，提炼关键结论和下一步行动。">${icon('file')}从项目资料中，提炼关键结论<span class="right">↗</span></button></div></section>`}else active().turns.forEach(m=>mountTurn(m));syncComposer();pinned=true;scrollBottom()}
function mountTurn(m){const section=document.createElement('section');section.dataset.turn=m.id;section.innerHTML=`<div class="user"><div class="bubble">${escape(m.prompt)}</div></div><article class="assistant"><div class="assistant-name"><span class="mark">${icon('logo')}</span>寻知</div><p class="intro">我会先梳理问题，再查阅相关资料，最后整理成清晰的建议。</p><div class="process"><button class="process-toggle" aria-expanded="${m.open}" aria-controls="history-${m.id}"><span class="status-icon"></span><span class="latest" role="status" aria-live="polite"></span><span class="step-count"></span><svg class="chevron"><use href="#chevron"/></svg></button><div class="history" id="history-${m.id}" ${m.open?'':'hidden'}><div class="history-head"><span>执行记录</span><span>模拟工具调用</span></div><ol class="history-list"></ol></div></div><div class="answer"></div><div class="answer-actions" hidden></div></article>`;$('#thread').append(section);m.el=section;section.querySelector('.process-toggle').onclick=()=>{m.open=!m.open;const b=section.querySelector('.process-toggle');b.setAttribute('aria-expanded',m.open);section.querySelector('.history').hidden=!m.open;updateJump()};renderProcess(m);renderAnswer(m)}
function renderProcess(m){const e=m.el;if(!e)return;const running=m.state==='processing',current=m.events.at(-1);e.querySelector('.status-icon').innerHTML=running?'<span class="spinner"></span>':icon(m.state==='stopped'?'retry':'check');e.querySelector('.latest').textContent=running?(current?steps[current.index][0]:'正在准备处理'):m.state==='stopped'?'已停止处理':`已完成处理 · 用时 ${m.seconds} 秒`;e.querySelector('.step-count').textContent=`${m.events.length} 个步骤`;e.querySelector('.process-toggle').setAttribute('aria-label',e.querySelector('.latest').textContent+'，'+m.events.length+' 个步骤，查看执行记录');e.querySelector('.history-list').innerHTML=m.events.map(ev=>`<li class="step ${!ev.done?'current':''}"><div class="step-title"><span>${escape(ev.done?steps[ev.index][2]:m.state==='stopped'?'已中止：'+steps[ev.index][0].replace('正在',''):steps[ev.index][0])}</span><time>${ev.time}s ${ev.done?'✓':m.state==='stopped'?'·':'处理中'}</time></div><code class="step-detail">${escape(steps[ev.index][1])}</code></li>`).join('')}
function renderAnswer(m){const e=m.el,answer=e.querySelector('.answer');answer.textContent=m.text;answer.classList.toggle('streaming',m.state==='streaming');const actions=e.querySelector('.answer-actions');if(['complete','stopped'].includes(m.state)){actions.hidden=false;actions.innerHTML=`${m.text?`<button data-action="copy" aria-label="复制回答">${icon('copy')}</button>`:''}<button data-action="retry" aria-label="重新生成">${icon('retry')}<span>${m.state==='stopped'?'重新生成':''}</span></button><span class="completed-note">${m.state==='stopped'?'已保留当前过程':'回答已完成'}</span>`;actions.querySelector('[data-action=retry]').onclick=()=>{if(job){toast('请先停止当前回答');return}submit(m.prompt)};const copy=actions.querySelector('[data-action=copy]');if(copy)copy.onclick=async()=>{try{await navigator.clipboard.writeText(m.text);toast('已复制回答')}catch{toast('请选中回答文字进行复制')}}}else actions.hidden=true}
function syncComposer(){const send=$('#send');send.setAttribute('aria-label',job?'停止生成':'发送消息');send.innerHTML=job?'<span class="stop"></span>':icon('arrow');send.disabled=!job&&!$('#input').value.trim();$('#input').placeholder=job?'可以先写下你的下一个问题…':'向寻知提问，或描述你想完成的事…'}
function scrollBottom(){if(pinned)$('#scroll').scrollTop=$('#scroll').scrollHeight;updateJump()}
function updateJump(){const s=$('#scroll');$('#jump').hidden=s.scrollHeight-s.clientHeight-s.scrollTop<100}
function toast(t){clearTimeout(toastTimer);$('#toast').textContent=t;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,1800)}
function pause(ms,signal){return new Promise(resolve=>{if(signal.aborted)return resolve(false);const abort=()=>{clearTimeout(t);resolve(false)},t=setTimeout(()=>{signal.removeEventListener('abort',abort);resolve(true)},ms/Number($('#speed').value));signal.addEventListener('abort',abort,{once:true})})}
function stop(){if(!job)return;const j=job;job=null;j.controller.abort();j.m.state='stopped';j.m.seconds=Math.max(1,Math.round((performance.now()-j.started)/1000));renderProcess(j.m);renderAnswer(j.m);syncComposer()}
function answerFor(prompt){if(/资料|项目|结论/.test(prompt)&&!/AI|交互/.test(prompt))return '这是一份项目资料整理的示例回答。当前演示没有读取真实文件，以下内容用于预览回答与过程记录的呈现效果。\n\n一、明确整理范围\n围绕项目目标、现有进展和未解决问题组织资料，优先保留与当前决策相关的信息。\n\n二、提炼关键结论\n将重复内容合并，每条结论保留对应依据。存在分歧或缺少信息的地方，单独列为待确认项。\n\n三、形成下一步行动\n把结论转为可以执行的任务，明确负责人、预期结果和完成时间。\n\n上方的执行记录保留了完整的模拟过程，可以展开回看。';return '建议采用「单条实时状态 + 可展开的执行记录」：把正在做的事说清楚，同时让回答本身保持清爽。\n\n1. 默认只呈现最新一步\n发送消息后，先给出一句简短的行动说明。下方只显示当前状态，例如“正在读取 产品需求.md”，完成后直接替换为下一步，不连续堆叠过程。\n\n2. 展开查看完整历史\n点击状态行即可展开时间线，按执行顺序展示已完成和正在执行的步骤。命令、文件名与耗时作为次级信息。新步骤出现时，保持用户选择的展开状态。\n\n3. 回答与过程自然衔接\n处理结束后，状态行收束为“已完成处理”，回答逐步输出。历史记录始终可以回看；用户正在查看上文时，不强制滚动到底部。\n\n4. 停止之后也有明确反馈\n点击停止，保留已产生的内容与执行记录，并提供重新生成入口。回答完成后，可以复制内容或继续追问。\n\n这份演示把较多步骤收进了可展开的过程里，默认视图仍然只保留一行。'}
async function submit(prompt){if(job)return;prompt=prompt.trim();if(!prompt)return;if(!active().turns.length){active().title=prompt.slice(0,18);$('#thread').innerHTML='';renderNav()}const m={id:'m'+(++seq),prompt,events:[],state:'processing',text:'',open:false,seconds:0};active().turns.push(m);$('#input').value='';active().draft='';$('#input').style.height='auto';mountTurn(m);pinned=true;const controller=new AbortController(),j={m,controller,started:performance.now()};job=j;syncComposer();scrollBottom();for(let i=0;i<steps.length;i++){if(controller.signal.aborted)return;m.events.push({index:i,done:false,time:Math.round((performance.now()-j.started)/1000)});renderProcess(m);scrollBottom();if(!await pause(steps[i][3],controller.signal))return;m.events.at(-1).done=true}m.seconds=Math.max(1,Math.round((performance.now()-j.started)/1000));m.state='streaming';renderProcess(m);const full=answerFor(prompt);for(let i=0;i<full.length;i+=4){if(controller.signal.aborted)return;m.text=full.slice(0,i+4);renderAnswer(m);scrollBottom();if(!await pause(28,controller.signal))return}m.state='complete';job=null;renderAnswer(m);syncComposer();scrollBottom()}
$('#form').onsubmit=e=>{e.preventDefault();if(job)stop();else submit($('#input').value)};$('#input').oninput=()=>{active().draft=$('#input').value;$('#input').style.height='auto';$('#input').style.height=Math.min(150,$('#input').scrollHeight)+'px';syncComposer()};$('#input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(!job)submit($('#input').value)}};$('#new').onclick=newSession;$('#sessions').onclick=e=>{const b=e.target.closest('[data-session]');if(!b||Number(b.dataset.session)===activeId)return;if(job){toast('请先停止当前回答，再切换对话');return}active().draft=$('#input').value;activeId=Number(b.dataset.session);$('#input').value=active().draft;render();$('#app').classList.remove('nav-open')};$('#thread').addEventListener('click',e=>{const b=e.target.closest('[data-prompt]');if(b){$('#input').value=b.dataset.prompt;active().draft=b.dataset.prompt;syncComposer();$('#input').focus()}});$('#scroll').addEventListener('scroll',()=>{const s=$('#scroll');pinned=s.scrollHeight-s.clientHeight-s.scrollTop<100;updateJump()},{passive:true});$('#jump').onclick=()=>{pinned=true;scrollBottom()};$('.menu').onclick=()=>$('#app').classList.add('nav-open');$('.mobile-overlay').onclick=()=>$('#app').classList.remove('nav-open');document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();newSession()}if(e.key==='Escape')$('#app').classList.remove('nav-open')});const firstDraft=$('#input').value;sessions.push({id:++seq,title:'新对话',turns:[],draft:firstDraft});activeId=seq;render();
</script>
</body></html>
